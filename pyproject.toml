[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worthy"
version = "0.1.0"
description = "Worthy (掌眼): decide what's worth indexing into your RAG knowledge base, via dynamic LLM + specialist routing that trains itself as you use it"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zicong", email = "xczics@gmail.com" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "embeddings",
    "vector-database",
    "llm",
    "text-classification",
    "chunk-filtering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "openai>=1.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/xczics/worthy"
Repository = "https://github.com/xczics/worthy"
Issues = "https://github.com/xczics/worthy/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
include = ["worthy*"]
