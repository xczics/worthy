[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worthy"
version = "0.1.0"
description = "Worthy(掌眼):大模型 + 专用小模型动态路由的入库判定工具,越用越省、越用越准"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "openai>=1.0",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["worthy*"]
